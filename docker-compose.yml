version: '3.8'

services:
  mangatrax:
    build:
      context: .
      dockerfile: Dockerfile
    image: mangatrax:latest
    container_name: mangatrax
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - CALIBRE_DIR=/calibre
      - STAGING_DIR=/staging
      - DATA_DIR=/app/data
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Note: BitTorrent downloader (qBittorrent, Flood, Torbox, etc.)
      # is configured 100% in-app via the MangaTrax Web UI (Settings & Downloads tab).
    volumes:
      # 1. Mount your Calibre library network share (read-only for zero-lock safety)
      - /path/to/calibre/library:/calibre:ro

      # 2. Staging folder where completed manga downloads are tagged before BookOrbit ingestion
      - /path/to/manga/staging:/staging

      # 3. Persistent application database, cover cache, and logs
      - ./data:/app/data
