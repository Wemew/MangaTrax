services:
  mangatrax:
    # Option A: Build directly from GitHub repo on TrueNAS
    build:
      context: https://github.com/Wemew/MangaTrax.git#main
      dockerfile: Dockerfile

    # Option B (Alternative): If you git cloned the repository locally on your server:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    image: mangatrax:latest
    container_name: mangatrax
    restart: unless-stopped

    # TrueNAS SCALE unprivileged 'apps' user and group
    user: "568:568"

    # Container security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ports:
      # Format: "HOST_PORT:CONTAINER_PORT"
      # Change 8082 if needed to avoid conflicts with other apps on your server
      - "8082:8080"

    environment:
      - PORT=8080
      - CALIBRE_DIR=/calibre
      - STAGING_DIR=/staging
      - DATA_DIR=/app/data
      - QBIT_URL=http://qbittorrent:8080
      - QBIT_USER=admin
      - QBIT_PASS=adminadmin
      - TZ=Etc/UTC

    volumes:
      # 1. Mount your Calibre library dataset (READ-ONLY for zero-lock safety)
      # Replace '/mnt/tank/media/calibre' with your actual dataset path:
      - /mnt/tank/media/calibre:/calibre:ro

      # 2. Mount your Manga Staging directory where downloads arrive and get tagged
      # Replace '/mnt/tank/media/manga/staging' with your staging path:
      - /mnt/tank/media/manga/staging:/staging

      # 3. Mount persistent storage for MangaTrax database, cached covers, and logs
      # Replace '/mnt/tank/apps/mangatrax/data' with your app dataset:
      - /mnt/tank/apps/mangatrax/data:/app/data
