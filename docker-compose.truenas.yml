services:
  mangatrax:
    # Option A: Build directly from GitHub repo on TrueNAS in Dockhand
    build:
      context: https://github.com/Wemew/MangaTrax.git#main
      dockerfile: Dockerfile

    # Option B: If you git cloned the repository locally on your server:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    image: mangatrax:latest
    container_name: mangatrax
    restart: unless-stopped
    # Cap Docker's json-file log so it cannot grow without bound. Host path:
    # /var/lib/docker/containers/<id>/<id>-json.log (recreate the container to apply).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ports:
      # Host port : Container port
      # Change 8082 if you already have another service running on it
      - "8082:8080"

    environment:
      - PORT=8080
      - CALIBRE_DIR=/calibre
      - STAGING_DIR=/staging
      # Raw downloads (qBittorrent / Torbox). Keep /downloads and /staging on the SAME
      # dataset/filesystem so routing moves files by rename instead of copying them.
      - DOWNLOADS_DIR=/downloads
      - DATA_DIR=/app/data
      # TrueNAS SCALE unprivileged 'apps' user and group (568:568)
      - PUID=568
      - PGID=568
      - TZ=Europe/Copenhagen  # Set your local timezone (e.g. Europe/Copenhagen, America/New_York)
      # Note: BitTorrent downloader (qBittorrent, Flood, Torbox, etc.)
      # is configured 100% in-app via the MangaTrax Web UI (Settings & Downloads tab).

      # ---- Authentication -------------------------------------------------
      # Modes: none | basic | oidc.  Default `none` keeps prior behaviour.
      # TLS is expected to terminate upstream (Traefik/NetBird). The app derives
      # redirect_uri and the cookie Secure flag ONLY from MANGATRAX_PUBLIC_URL,
      # never from request headers, so spoofed Host headers cannot redirect a login.
      - MANGATRAX_AUTH_MODE=none

      # -- oidc (PocketID) -- REQUIRED when MANGATRAX_AUTH_MODE=oidc
      # - MANGATRAX_PUBLIC_URL=https://mangatrax.example.com
      # - MANGATRAX_SESSION_SECRET=CHANGE_ME   # python -c "import secrets;print(secrets.token_urlsafe(48))"
      # - MANGATRAX_OIDC_ISSUER=https://pocketid.example.com
      # - MANGATRAX_OIDC_CLIENT_ID=your-client-id
      # - MANGATRAX_OIDC_CLIENT_SECRET=your-client-secret
      # - MANGATRAX_ADMIN_GROUPS=admin        # IdP group name(s) granting Admin
      # - MANGATRAX_OIDC_GROUPS_CLAIM=groups  # claim carrying the group list
      #   The MangaTrax client requests the `groups` scope; make sure the
      #   admin group is allowed on the client's Access page in PocketID.

      # -- basic -- also acts as break-glass during a PocketID outage when mode=oidc
      # - MANGATRAX_BASIC_USER=admin
      # - MANGATRAX_BASIC_PASS=CHANGE_ME

      # -- optional hardening / TrueNAS path containment --
      # - MANGATRAX_SESSION_MAX_AGE=604800    # 7 days
      # - MANGATRAX_CSRF_PROTECT=1            # Origin/Referer check on unsafe methods
      # - MANGATRAX_DEBUG_ACTIONS=0           # /api/debug/action is 403 unless set to 1
      # - MANGATRAX_PATH_ROOTS=/calibre:/staging   # restrict settings paths to these roots

    volumes:
      # 1. Mount your Calibre library dataset (READ-ONLY for zero-lock safety)
      # Replace '/mnt/tank/media/calibre' with your actual dataset path:
      - /mnt/tank/media/calibre:/calibre:ro

      # 2. Final destination: tagged .cbz files land here, ready to import into Calibre.
      # Replace '/mnt/tank/media/manga/staging' with your staging path.
      # Keep this on the SAME dataset/filesystem as the downloads folder below.
      - /mnt/tank/media/manga/staging:/staging

      # 3. Raw downloads for both engines (qBittorrent and Torbox). Files stay here until
      # their series exists in Calibre, then they are tagged and moved to /staging.
      # Replace '/mnt/tank/media/manga/downloads' with your downloads path.
      - /mnt/tank/media/manga/downloads:/downloads

      # 4. Mount persistent storage for MangaTrax database, cached covers, and logs
      # Dockhand keeps relative './data' inside the stack directory automatically:
      - ./data:/app/data
      # Or use a dedicated TrueNAS dataset path:
      # - /mnt/tank/apps/mangatrax/data:/app/data
